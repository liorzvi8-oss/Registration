<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>SignUp Page</title>
    <style>
        body {
            font-family: 'Times New Roman';
            background-color: #ffffff;
            margin: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 850px;
            padding: 12px;
            background-color: #fff;
        }

        table {
            width: 100%;
            border: 1px solid #999;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid #999;
            padding: 8px;
            vertical-align: middle;
            border-bottom: 1px solid #ddd;
        }

        .header-table td {
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        .title-row {
            background-color: #f2f7ff;
            color: #2e7d32;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            border: 1px solid #999;
            margin-bottom: 15px;
        }

        .main-form-table {
            width: 100%;
            background-color: #ffffff;
        }

            .main-form-table > tr > td,
            .main-form-table > tbody > tr > td {
                width: 50%;
                padding: 10px;
                vertical-align: top;
                border: 1px solid #999;
                background-color: #ffffff;
            }

        .inner-table {
            width: 100%;
            border-collapse: collapse;
        }

            .inner-table td {
                padding: 12px 5px;
                border: none;
                border-bottom: 1px solid #eee;
            }

            .inner-table tr:last-child td {
                border-bottom: none;
            }

        .label-cell {
            width: 30%;
            font-weight: bold;
            text-align: right;
            border-left: 1px solid #ccc !important;
            padding-left: 10px;
        }

        .input-cell {
            width: 70%;
        }

        input[type="text"], input[type="password"], input[type="email"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 2px;
            background-color: #fff;
        }

        .inline-fields {
            display: flex;
            gap: 8px;
        }

            .inline-fields select, .inline-fields input {
                flex: 1;
            }

        .dropdown-narrow {
            max-width: 80px;
        }

        .email-field {
            text-align: right;
            direction: rtl;
        }

            .email-field::placeholder {
                text-align: right;
            }

        .gender-options {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .gender-box {
            border: 1px solid #aaa;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: #fff;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            margin-top: 20px;
            margin-bottom: 15px;
        }

            .checkbox-container a {
                color: blue;
                text-decoration: underline;
            }

        .submit-btn {
            width: 100%;
            background-color: #4caf50;
            color: white;
            border: 1px solid #3d8b40;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

            .submit-btn:hover {
                background-color: #43a047;
            }
    </style>
</head>

    <script>
              function togglePasswordVisibility() {
                              var passwordField = document.getElementById("password-input");
                              var confirmPasswordField = document.getElementById("confirm-password-input");
                              var showPassCheckbox = document.getElementById("show-pass");
                              if (showPassCheckbox.checked) {
                                  passwordField.type = "text";
                                  confirmPasswordField.type = "text";
                              } else {
                                  passwordField.type = "password";
                                  confirmPasswordField.type = "password";
                              }
                          }
